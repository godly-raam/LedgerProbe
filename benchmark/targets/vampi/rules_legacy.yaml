# Naive baseline: a cross-tenant request must return exactly 403.
# It is intentionally status-only and has no controls, canaries or confirmations.
# 404, 401 and JSON soft-denials therefore become false positives.
rules:
  - id: vampi-books-object
    name: Legacy status check for another user's book
    severity: HIGH
    owasp_category: API1:2023
    cvss_score: 7.5
    target_endpoints:
      - path: /books/v1/{book_title}
        method: GET
    auth_contexts:
      primary: owner
      forbidden: other
    parameters:
      path:
        book_title: "{{book_title}}"
    assertions:
      - type: status_code
        expected: 403

  - id: vampi-users-password
    name: Legacy status check for another user's password update
    severity: HIGH
    owasp_category: API1:2023
    cvss_score: 7.5
    target_endpoints:
      - path: /users/v1/{username}/password
        method: PUT
    auth_contexts:
      primary: owner
      forbidden: other
    parameters:
      path:
        username: "{{owner_username}}"
    body:
      password: "{{new_password}}"
    assertions:
      - type: status_code
        expected: 403

  - id: vampi-users-object
    name: Legacy status check for another user's profile
    severity: HIGH
    owasp_category: API1:2023
    cvss_score: 7.5
    target_endpoints:
      - path: /users/v1/{username}
        method: GET
    auth_contexts:
      primary: owner
      forbidden: other
    parameters:
      path:
        username: "{{owner_username}}"
    assertions:
      - type: status_code
        expected: 403

  - id: vampi-users-list
    name: Legacy status check for the user directory
    severity: HIGH
    owasp_category: API3:2023
    cvss_score: 7.5
    target_endpoints:
      - path: /users/v1
        method: GET
    auth_contexts:
      primary: owner
      forbidden: other
    assertions:
      - type: status_code
        expected: 403

  - id: vampi-users-debug
    name: Legacy status check for the debug directory
    severity: CRITICAL
    owasp_category: API3:2023
    cvss_score: 9.1
    target_endpoints:
      - path: /users/v1/_debug
        method: GET
    auth_contexts:
      primary: owner
      forbidden: other
    assertions:
      - type: status_code
        expected: 403

  - id: vampi-home
    name: Legacy status check for the public banner
    severity: INFO
    owasp_category: API9:2023
    cvss_score: 1.0
    target_endpoints:
      - path: /
        method: GET
    auth_contexts:
      primary: owner
      forbidden: other
    assertions:
      - type: status_code
        expected: 403

  - id: vampi-book-list
    name: Legacy status check for the public book catalogue
    severity: LOW
    owasp_category: API3:2023
    cvss_score: 2.0
    target_endpoints:
      - path: /books/v1
        method: GET
    auth_contexts:
      primary: owner
      forbidden: other
    assertions:
      - type: status_code
        expected: 403

  - id: vampi-me
    name: Legacy status check for the caller profile
    severity: LOW
    owasp_category: API1:2023
    cvss_score: 2.0
    target_endpoints:
      - path: /me
        method: GET
    auth_contexts:
      primary: owner
      forbidden: other
    assertions:
      - type: status_code
        expected: 403
