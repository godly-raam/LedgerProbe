# Extension rules for VAmPI, authored once from README.md, api_views/users.py and
# openapi_specs/openapi3.yml. The register-admin cases create an account and
# cannot restore it through the API (VAmPI exposes no self-delete), so they are
# NOT RUN; the admin-only DELETE case is likewise absent because a successful
# deletion cannot be restored. benchmark/run_ext.py records those three.
rules:
  - id: vampi-bola-email-ignores-path-user
    name: Email update must not affect the user named in the path
    severity: high
    owasp_category: API1:2023
    cvss_score: 8.1
    target_endpoints:
      - path: /users/v1/{username}/email
        method: PUT
    auth_contexts:
      primary: other
      forbidden: owner
    parameters:
      path:
        username: "{{other_username}}"
    body:
      email: "{{new_email}}"
    mutating: true
    acceptable_status: [401, 403, 404]
    verify:
      mode: state_diff
      snapshot:
        method: GET
        path: /me
        auth: primary
      fields: [email]
    restore:
      - method: PUT
        path: /users/v1/{{other_username}}/email
        auth: primary
        body:
          email: "{{other_email}}"
      - method: PUT
        path: /users/v1/{{owner_username}}/email
        auth: forbidden
        body:
          email: "{{owner_email}}"
    confirm: 1
