# Trimmed crAPI stack for read-only authorization testing. Chatbot/chromadb are
# omitted because they are irrelevant to BOLA and consume memory. All published
# ports bind to loopback. Every image is pinned by manifest digest. Docker Hub
# published 1.1.6 only for crapi-identity; the other five crAPI components were
# published as `latest` on the v1.1.6 release day and are used by digest.
name: ledgerprobe-crapi

services:
  crapi-identity:
    image: crapi/crapi-identity@sha256:51b4cdd1a88f24e00e66c4c37735e7f8adbb98071252f3cf4f6dda9e00671aed
    environment:
      DB_NAME: crapi
      DB_USER: admin
      DB_PASSWORD: crapisecretpassword
      DB_HOST: postgresdb
      DB_PORT: "5432"
      SERVER_PORT: "8080"
      JWT_SECRET: crapi
      MAILHOG_HOST: mailhog
      MAILHOG_PORT: "1025"
      MAILHOG_DOMAIN: example.com
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "587"
      SMTP_EMAIL: user@example.com
      SMTP_PASS: xxxxxxxxxxxxxx
      SMTP_FROM: no-reply@example.com
      SMTP_AUTH: "true"
      SMTP_STARTTLS: "true"
      API_GATEWAY_URL: https://api.mypremiumdealership.com
      JWT_EXPIRATION: "604800000"
      TLS_ENABLED: "false"
      ENABLE_SHELL_INJECTION: "false"
      ENABLE_LOG4J: "false"
    depends_on:
      postgresdb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/health.sh"]
      interval: 10s
      timeout: 10s
      retries: 30

  crapi-community:
    image: crapi/crapi-community@sha256:8ba0c7eda86ae065a673f1fa554d0109a24f25c5a8d65097ae024e5ee715c54e
    environment:
      IDENTITY_SERVICE: crapi-identity:8080
      DB_NAME: crapi
      DB_USER: admin
      DB_PASSWORD: crapisecretpassword
      DB_HOST: postgresdb
      DB_PORT: "5432"
      SERVER_PORT: "8087"
      MONGO_DB_HOST: mongodb
      MONGO_DB_PORT: "27017"
      MONGO_DB_USER: admin
      MONGO_DB_PASSWORD: crapisecretpassword
      MONGO_DB_NAME: crapi
      TLS_ENABLED: "false"
    depends_on:
      postgresdb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      crapi-identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/health.sh"]
      interval: 10s
      timeout: 10s
      retries: 30

  crapi-workshop:
    image: crapi/crapi-workshop@sha256:d4d2d94d35a31e211b04d5a771881f5ae13e358e8fa0804463ae3bace05dd815
    environment:
      IDENTITY_SERVICE: crapi-identity:8080
      DB_NAME: crapi
      DB_USER: admin
      DB_PASSWORD: crapisecretpassword
      DB_HOST: postgresdb
      DB_PORT: "5432"
      SERVER_PORT: "8000"
      MONGO_DB_HOST: mongodb
      MONGO_DB_PORT: "27017"
      MONGO_DB_USER: admin
      MONGO_DB_PASSWORD: crapisecretpassword
      MONGO_DB_NAME: crapi
      SECRET_KEY: crapi
      API_GATEWAY_URL: https://api.mypremiumdealership.com
      TLS_ENABLED: "false"
      FILES_LIMIT: "1000"
    depends_on:
      postgresdb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      crapi-identity:
        condition: service_healthy
      crapi-community:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/health.sh"]
      interval: 10s
      timeout: 10s
      retries: 30

  api.mypremiumdealership.com:
    image: crapi/gateway-service@sha256:97dade9daf0e758547b1686e2d3303c8c9b79838167f728a9211f0ee1f4622b0
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo -n \"GET / HTTP/1.1\\n\\n\" > /dev/tcp/127.0.0.1/443'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  crapi-web:
    image: crapi/crapi-web@sha256:b27d246c646bd33898e7d1d2095b6e7576c0993a7b81a73aa7386929493d7151
    ports:
      - "127.0.0.1:8888:80"
    environment:
      COMMUNITY_SERVICE: crapi-community:8087
      IDENTITY_SERVICE: crapi-identity:8080
      WORKSHOP_SERVICE: crapi-workshop:8000
      # The chatbot is intentionally omitted; nginx still needs a nonempty upstream.
      CHATBOT_SERVICE: crapi-identity:8080
      MAILHOG_WEB_SERVICE: mailhog:8025
      TLS_ENABLED: "false"
    depends_on:
      crapi-community:
        condition: service_healthy
      crapi-identity:
        condition: service_healthy
      crapi-workshop:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 10s
      timeout: 10s
      retries: 30

  postgresdb:
    image: postgres@sha256:2a453914efff6156786247b2399e6f9f18d7fc37e1ca5574a23aba172cf37d3e
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: crapisecretpassword
      POSTGRES_DB: crapi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 10s
      retries: 30
    volumes:
      - postgresql-data:/var/lib/postgresql/data

  mongodb:
    image: mongo@sha256:52c42cbab240b3c5b1748582cc13ef46d521ddacae002bbbda645cebed270ec0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: crapisecretpassword
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongo localhost:27017/test --quiet"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    volumes:
      - mongodb-data:/data/db

  mailhog:
    image: crapi/mailhog@sha256:015c23f79d40c9dc1800cd0a458503b89aeda3b585a12c37d53829d6c7d61fdd
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8025"]
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  postgresql-data:
  mongodb-data:
