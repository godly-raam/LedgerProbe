# Naive baseline: every cross-tenant read must return exactly 403. No controls,
# canaries or confirmations. Safe 200/204/404 responses become false positives.
rules:
  - id: crapi-vehicle-location
    name: Legacy status check for another user's vehicle location
    severity: HIGH
    owasp_category: API1:2023
    cvss_score: 7.5
    target_endpoints:
      - path: /identity/api/v2/vehicle/{vehicleId}/location
        method: GET
    auth_contexts:
      primary: owner
      forbidden: other
    parameters:
      path:
        vehicleId: "{{owner_vehicle_id}}"
    assertions:
      - type: status_code
        expected: 403

  - id: crapi-mechanic-report
    name: Legacy status check for another user's mechanic report
    severity: HIGH
    owasp_category: API1:2023
