# Differential rules for crAPI. Public/self-scoped controls use no canary;
# owner-specific endpoints require a baseline canary. Self-scoped safe
# endpoints may be INCONCLUSIVE because the engine expects a denial, which is
# reported honestly rather than turned into a finding.
rules:
  - id: crapi-vehicle-location
    name: Another user must not read a vehicle location
    severity: HIGH
    owasp_category: API1:2023
    cvss_score: 8.1
    target_endpoints:
      - path: /identity/api/v2/vehicle/{vehicleId}/location
        method: GET
    auth_contexts:
      primary: owner
      forbidden: other
    parameters:
      path:
        vehicleId: "{{owner_vehicle_id}}"
    acceptable_status: [401, 403, 404]
    leak_detection:
      canaries: ["{{owner_email}}"]
      min_unique_leaf_values: 2
      ignore_fields: []
    controls:
      nonexistent_object: true
      unauthenticated: true
    confirm: 2
    require_primary_canary: true

  - id: crapi-mechanic-report
    name: Another user must not read a mechanic report
    severity: HIGH
    owasp_category: API1:2023
    cvss_score: 8.1
    target_endpoints:
      - path: /workshop/api/mechanic/mechanic_report
        method: GET
    auth_contexts:
      primary: owner
      forbidden: other
    parameters:
      query:
        report_id: "{{report_id}}"
    acceptable_status: [400, 401, 403, 404]
    leak_detection:
