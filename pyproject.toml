[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerprobe"
dynamic = ["version"]
description = "API authorization and business-logic testing engine"
readme = "README.md"
license = { text = "MIT" }
keywords = ["api", "security", "authorization", "bola", "idor", "openapi", "sarif"]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7",
  "openapi-spec-validator>=0.7.2,<0.8",
]

[project.urls]
Homepage = "https://github.com/godly-raam/LedgerProbe"
Issues = "https://github.com/godly-raam/LedgerProbe/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "starlette>=0.37,<2",
  "httpx>=0.27,<1.0",
  "anyio>=4,<5",
  "jsonschema>=4.20,<5",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
  "fastapi>=0.110,<1",
  "sqlalchemy>=2,<3",
  "PyJWT>=2,<3",
]
h2 = ["h2>=4.1,<5"]
aws = ["boto3>=1.34,<2"]
mitm = ["mitmproxy>=10,<12"]

[project.scripts]
ledgerprobe = "ledgerprobe:main"

[tool.setuptools]
py-modules = ["ledgerprobe"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pkg.version.__version__"}

[tool.setuptools.packages.find]
include = ["pkg*", "schemas*"]

[tool.setuptools.package-data]
schemas = ["*.json"]
