# Differential, read-only tenant-isolation policy. See pkg/rules/README.md.
id: bola-cross-tenant-access
name: Broken Object Level Authorization Audit
severity: HIGH
owasp_category: API1:2023
cvss_score: 8.1
target_endpoints:
  - path: /api/v1/family/allowance/{teen_id}
    method: GET
auth_contexts:
  primary: parent_user_a
  forbidden: parent_user_b
parameters:
  path:
    teen_id: "{{teen_id}}"
acceptable_status:
  - 403
  - 404
leak_detection:
  canaries:
    - "{{teen_id}}"
  min_unique_leaf_values: 1
  ignore_fields:
    - detail
controls:
  nonexistent_object: true
  unauthenticated: true
confirm: 2
