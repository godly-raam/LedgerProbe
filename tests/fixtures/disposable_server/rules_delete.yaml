id: disposable-delete
name: A user must not delete another user's disposable item
severity: high
owasp_category: API1:2023
cvss_score: 8.1
target_endpoints:
  - path: /api/v1/items/{id}
    method: DELETE
auth_contexts:
  primary: owner
  forbidden: user
parameters:
  path:
    id: "{{fixture.id}}"
mutating: true
fixture:
  create:
    - identity: owner
      request:
        method: POST
        path: /api/v1/items
        body:
          name: "{{gen.item_name}}"
      capture:
        - name: id
          from: json
          path: id
  cleanup:
    - identity: owner
      when_defined: fixture.id
      request:
        method: DELETE
        path: /api/v1/items/{{fixture.id}}
    - identity: owner
      request:
        method: GET
        path: /api/v1/health
      ok_status: [200]
verify:
  mode: probe
  request:
    method: GET
    path: /api/v1/items/{{fixture.id}}
    auth: primary
  expected_status: 404
variables:
  generated:
    - name: item_name
      pattern: "lp_lpsentineldisposable7731_{rand8}"