id: authz-caller-scope
name: Caller-scoped profile differential audit
severity: HIGH
owasp_category: API1:2023
cvss_score: 8.1
target_endpoints:
  - path: /api/v1/profile
    method: GET
auth_contexts:
  primary: owner
  forbidden: other
acceptable_status: [401, 403, 404]
scope: caller
require_owner_canary_in_baseline: true
leak_detection:
  canaries: ["{{canary_value}}"]
  min_unique_leaf_values: 3
  ignore_fields: [detail]
controls:
  nonexistent_object: false
  unauthenticated: false
confirm: 2
