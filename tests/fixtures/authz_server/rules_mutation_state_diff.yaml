id: authz-mutate-state-diff
name: Forbidden mutation must not alter owner status
severity: HIGH
owasp_category: API1:2023
cvss_score: 8.1
target_endpoints:
  - path: /api/v1/mutate/{id}
    method: PUT
auth_contexts:
  primary: owner
  forbidden: other
parameters:
  path:
    id: "{{id}}"
mutating: true
body:
  status: CHANGED
acceptable_status: [401, 403, 404]
verify:
  mode: state_diff
  snapshot:
    method: GET
    path: /api/v1/objects/{{id}}
    auth: primary
  fields: [status]
restore:
  - method: PUT
    path: /api/v1/mutate/{{id}}
    auth: primary
    body:
      status: ACTIVE
confirm: 1
