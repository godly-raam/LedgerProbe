id: authz-list-isolation
name: List Query Filter Differential Audit
severity: HIGH
owasp_category: API1:2023
cvss_score: 8.1
target_endpoints:
  - path: /api/v1/items
    method: GET
auth_contexts:
  primary: owner
  forbidden: other
parameters:
  query:
    owner_id: "{{owner_id}}"
acceptable_status:
  - 401
  - 403
  - 404
leak_detection:
  canaries:
    - "{{canary_value}}"
  min_unique_leaf_values: 1
  ignore_fields:
    - detail
controls:
  nonexistent_object: true
  unauthenticated: true
confirm: 2
