id: authz-mutate-marker
name: Forbidden mutation must not change owner state
severity: HIGH
owasp_category: API1:2023
cvss_score: 8.1
target_endpoints:
  - path: /api/v1/mutate/{id}
    method: PUT
auth_contexts:
  primary: owner
  forbidden: other
parameters:
  path:
    id: "{{id}}"
mutating: true
body:
  marker: "{{marker}}"
acceptable_status: [401, 403, 404]
verify:
  mode: marker
  readback:
    method: GET
    path: /api/v1/objects/{{id}}
    auth: primary
restore:
  - method: PUT
    path: /api/v1/mutate/{{id}}
    auth: primary
    body:
      marker: ""
confirm: 1
