id: authz-bfla-mutating
name: Unprivileged user must not invoke admin action
severity: HIGH
owasp_category: API5:2023
cvss_score: 8.1
check: bfla
privileged: admin
unprivileged: user
target_endpoints:
  - path: /api/v1/admin/action
    method: POST
mutating: true
body:
  marker: "{{marker}}"
acceptable_status: [401, 403, 404]
verify:
  mode: marker
  readback:
    method: GET
    path: /api/v1/admin/state
    auth: primary
restore:
  - method: POST
    path: /api/v1/admin/action
    auth: primary
    body:
      marker: ""
confirm: 1
