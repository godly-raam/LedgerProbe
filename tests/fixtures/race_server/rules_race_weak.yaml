id: authz-race-weak
name: Weakly synchronized wallet race must not pass
severity: HIGH
owasp_category: API6:2023
cvss_score: 8.1
target_endpoints:
  - path: /race/wallet/spend
    method: POST
auth_contexts:
  primary: owner
  forbidden: other
mutating: true
body:
  amount: 10
race:
  requests: 10
  rounds: 5
  sync: burst
  identity: other
  reset:
    - method: POST
      path: /race/reset
      auth: none
  success_status: [200]
  max_spread_ms: 0.0001
  invariant:
    max_successes: 1
    ledger:
      snapshot:
        method: GET
        path: /race/wallet
        auth: none
      path: balance
      delta_per_success: -10
      max_total_effect: 10
restore:
  - method: POST
    path: /race/reset
    auth: none
