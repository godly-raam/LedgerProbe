name: FinShield-Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"

    steps:
      - name: Check out full history for gitleaks
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan filesystem secrets with Trivy
        run: trivy fs --scanners secret --skip-dirs benchmark/.out --skip-dirs .venv --skip-dirs dashboard/.next --exit-code 1 .

      - name: Install gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan full git history with gitleaks
        run: |
          gitleaks detect --source . --redact -v \
            --report-format sarif --report-path gitleaks.sarif

      - name: Upload gitleaks SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: warn

  audit-and-build:
    name: Audit, fuzz, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            mock-bank-api/requirements-dev.txt
            logic-fuzzer/requirements.txt
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mock-bank-api/requirements-dev.txt -e ".[dev]"

      - name: Test LedgerProbe engine
        run: python -m pytest tests -q --junitxml=.demo/engine-tests.xml

      - name: Verify differential BOLA verdicts with bug enabled and disabled
        run: python -m pytest tests/test_lab_differential.py -q

      - name: Test API behavior
        working-directory: mock-bank-api
        run: python -m pytest -q

      - name: Test mobile attestation scoring
        working-directory: mobile-harness
        run: python -m pytest -q

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Fuzz the live mock bank
        working-directory: mock-bank-api
        run: |
          set -euo pipefail
          python -m uvicorn app.asgi:app --host 127.0.0.1 --port 8000 --log-level warning &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "API exited before becoming healthy" >&2
              exit 1
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "API did not become healthy" >&2
            exit 1
          fi

          cd ../logic-fuzzer
          python main.py --base-url http://127.0.0.1:8000 --out reports --allow-mutations

          python - <<'PY'
          import glob
          import json
          import sys

          paths = sorted(glob.glob("reports/report-*.json"))
          if not paths:
              sys.exit("fuzzer produced no report")

          with open(paths[-1], encoding="utf-8") as handle:
              report = json.load(handle)

          check_ids = {finding["check_id"] for finding in report["findings"]}
          expected = {"BOLA-ALLOWANCE-WRITE", "MCC-ARRAY-BYPASS", "RACE-LIMIT-BYPASS"}
          missing = expected - check_ids
          if missing:
              sys.exit(f"fuzzer missed expected findings: {sorted(missing)}")

          print(
              f"{report['run']['id']}: score {report['run']['score']}, "
              f"{report['summary']['findings']} findings, "
              f"{report['run']['checks_passed']}/{report['run']['checks_total']} checks passed"
          )
          PY

          cd ..
          python -m examples.prepare_demo --base-url http://127.0.0.1:8000
          scan_status=0
          python ledgerprobe.py --spec .demo/openapi.json \
            --base-url http://127.0.0.1:8000 --rules rulesets/abac_isolation.yaml \
            --inputs .demo/inputs.json --read-only --max-rps 5 \
            --sarif logic-fuzzer/reports/results.sarif \
            --junit logic-fuzzer/reports/results.xml || scan_status=$?
          # This intentionally vulnerable lab must produce a policy failure.
          test "$scan_status" -eq 1

      - name: Upload engine reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerprobe-reports
          path: |
            .demo/engine-tests.xml
            logic-fuzzer/reports/results.sarif
            logic-fuzzer/reports/results.xml
          if-no-files-found: warn

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

  corpus:
    name: Authorization fixture corpus and metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run corpus test suite
        run: python -m pytest tests/test_corpus.py -v

      - name: Compute corpus metrics
        run: python tests/corpus_metrics.py --output corpus_metrics.md

      - name: Upload corpus metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: corpus-metrics
          path: corpus_metrics.md

  docker:
    name: Container build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4  # TODO: pin SHA

      - name: Build image
        run: docker build -t ledgerprobe:ci .

      - name: Verify installed CLI
        run: docker run --rm ledgerprobe:ci --version

      - name: Offline diff and drift smoke test
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/tests/fixtures/smoke:/smoke:ro" ledgerprobe:ci \
            diff /smoke/results-old.json /smoke/results-new.json
          docker run --rm -v "$PWD/tests/fixtures/smoke:/smoke:ro" ledgerprobe:ci \
            drift --spec /smoke/openapi.json --inventory /smoke/inventory.json

      - name: Install Trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan image for fixed HIGH/CRITICAL vulnerabilities
        run: trivy image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 ledgerprobe:ci
